<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriSmart AI — Sign Up</title>
    <link rel="stylesheet" href="css/neo-brutalism.css">
</head>
<body>
    <header class="nav-header">
        <h1>NutriSmart AI</h1>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <div class="container auth-container">
        <div class="brutal-card">
            <h2 style="text-align:center;">Join NutriSmart</h2>
            <p style="text-align:center; margin-bottom:25px;">Start your healthy eating journey today.</p>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="brutal-input" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" class="brutal-input" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="brutal-input" required placeholder="Min 8 chars, 1 upper, 1 number">
                </div>
                <div id="password-strength" style="height:8px; background:#eee; border:2px solid #111; margin-bottom:15px;">
                    <div id="strength-bar" style="height:100%; width:0%; transition: width 0.3s, background 0.3s;"></div>
                </div>
                <div id="signup-error" style="display:none; padding:12px; background:var(--accent-red); color:#fff; border:3px solid #111; font-weight:700; margin-bottom:15px; text-align:center;"></div>
                <button type="submit" class="brutal-btn" style="width:100%;">Create Account</button>
            </form>
            <p style="text-align:center; margin-top:20px;">Already have an account? <a href="login.html" style="color:var(--accent-blue); font-weight:700; text-decoration:underline;">Login</a></p>
        </div>
    </div>

    <footer class="brutal-footer">
        <p>&copy; 2026 NutriSmart AI &mdash; Eat Smart. Feel Great.</p>
    </footer>
    <script src="js/auth.js"></script>
</body>
</html>
